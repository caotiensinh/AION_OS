name: G1 AION health real BitBake install (public runner)

on:
  pull_request:
    paths:
      - '.github/workflows/g1-health-install.yml'
      - 'meta-aion/recipes-core/aion-health/**'
      - 'tests/verify_health_install.py'
      - 'tests/test_health_install_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-health-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Build and inspect aion-health do_install (not an OS image)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Host resource preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          free_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          mem_kib="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          test "$free_kib" -ge 8388608
          test "$mem_kib" -ge 4194304
          echo "SHA=$(git rev-parse HEAD)"
          df -h "$GITHUB_WORKSPACE"
          free -h
      - name: Install supported Yocto host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential chrpath cpio debianutils diffstat file gawk git \
            iputils-ping libacl1 libcrypt-dev locales python3 python3-venv \
            python3-git python3-jinja2 python3-pexpect python3-pip \
            python3-subunit socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
      - name: Set up pinned kas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aion-kas"
          "$RUNNER_TEMP/aion-kas/bin/pip" install --disable-pip-version-check 'kas==5.5'
          "$RUNNER_TEMP/aion-kas/bin/kas" --version
          "$RUNNER_TEMP/aion-kas/bin/kas" dump --format json bsp/raspberrypi4-64.yml > "$RUNNER_TEMP/kas-dump.json"
          python3 tests/validate_kas_dump.py "$RUNNER_TEMP/kas-dump.json"
      - name: Run real aion-health BitBake do_install and verify installed files
        shell: bash
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          export KAS_WORK_DIR="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/aion-kas/bin/kas" shell bsp/raspberrypi4-64.yml \
            -c 'bitbake -c install aion-health && bitbake -e aion-health > /tmp/aion-health.env && python3 "$GITHUB_WORKSPACE/tests/verify_health_install.py" --env /tmp/aion-health.env --out "$RUNNER_TEMP/aion-health-install-evidence.json"'
          echo "AION_HEALTH_INSTALL_VERIFIED=true"
      - name: Persist bounded verification summary
        if: always()
        shell: bash
        run: |
          set -eu
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "scope=bitbake_do_install_only"
            echo "image_built=false"
            echo "board_booted=false"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RUNNER_TEMP/aion-install-summary.txt"
      - name: Upload compact evidence (no rootfs or secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-aion-health-install-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aion-install-summary.txt
            ${{ runner.temp }}/aion-health-install-evidence.json
            ${{ runner.temp }}/kas-dump.json
          if-no-files-found: warn
          retention-days: 14
