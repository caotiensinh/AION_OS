name: AION Edge self-hosted build
run-name: AION Edge ${{ inputs.mode }} - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate = kas YAML only; parse = real BitBake metadata; build = parse then compile'
        required: true
        type: choice
        default: validate
        options:
          - validate
          - parse
          - build

permissions:
  contents: read

concurrency:
  group: aion-edge-build
  cancel-in-progress: false

jobs:
  edge:
    # Opt-in only: no expensive builds on GitHub-hosted runners.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Environment and safety preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -d meta-aion/conf
          test -d bsp
          test -f bsp/raspberrypi4-64.yml
          command -v git
          command -v python3
          command -v gcc
          command -v make
          command -v tar
          command -v xz
          # First prove the intended work filesystem has sufficient capacity.
          # Real BitBake metadata parse also clones layers and requires ample space.
          free_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          mem_kib=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          if [ "${{ inputs.mode }}" = "build" ]; then
            min_free_kib=125829120
            min_mem_kib=16777216
          elif [ "${{ inputs.mode }}" = "parse" ]; then
            min_free_kib=31457280
            min_mem_kib=8388608
          else
            min_free_kib=1048576
            min_mem_kib=1048576
          fi
          if [ "$free_kib" -lt "$min_free_kib" ] || [ "$mem_kib" -lt "$min_mem_kib" ]; then
            echo "::error::Insufficient RAM or free workspace capacity for the selected mode."
            exit 1
          fi
          echo "RUNNER=$(uname -a)"
          echo "GIT_SHA=$(git rev-parse HEAD)"
          df -h .
          free -h
      - name: Install pinned kas in isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aion-kas-venv"
          "$RUNNER_TEMP/aion-kas-venv/bin/python" -m pip install 'kas==5.5'
          "$RUNNER_TEMP/aion-kas-venv/bin/kas" --version
      - name: Validate manifest using kas parser
        shell: bash
        run: |
          set -euo pipefail
          export KAS_WORK_DIR="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/aion-kas-venv/bin/kas" dump --format json bsp/raspberrypi4-64.yml > "$RUNNER_TEMP/aion-kas-expanded.json"
          python3 tests/validate_kas_dump.py "$RUNNER_TEMP/aion-kas-expanded.json"
      - name: BitBake metadata parse and target availability
        if: ${{ inputs.mode == 'parse' || inputs.mode == 'build' }}
        shell: bash
        run: |
          set -euo pipefail
          export KAS_WORK_DIR="$GITHUB_WORKSPACE"
          # Parse recipe metadata and verify that AION's image target can be resolved.
          # This clones source layers but does not compile the image.
          "$RUNNER_TEMP/aion-kas-venv/bin/kas" shell bsp/raspberrypi4-64.yml -c 'bitbake -p && bitbake -e aion-edge-image >/dev/null' 2>&1 | tee "$RUNNER_TEMP/aion-bitbake-parse.log"
      - name: Build on self-hosted runner (explicit mode only)
        if: ${{ inputs.mode == 'build' }}
        shell: bash
        run: |
          set -euo pipefail
          export KAS_WORK_DIR="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/aion-kas-venv/bin/kas" build bsp/raspberrypi4-64.yml 2>&1 | tee "$RUNNER_TEMP/aion-bitbake.log"
      - name: Record build evidence without secrets or whole disk images
        if: always()
        shell: bash
        run: |
          set -eu
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "mode=${{ inputs.mode }}"
            echo "machine=raspberrypi4-64"
            echo "UTC=$(date -u +%FT%TZ)"
            echo "host=$(uname -m)"
            echo "bitbake_parse_attempted=${{ inputs.mode != 'validate' }}"
            echo "image_build_attempted=${{ inputs.mode == 'build' }}"
          } > "$RUNNER_TEMP/aion-evidence.txt"
          find "$GITHUB_WORKSPACE/build/tmp/deploy/images/raspberrypi4-64" -maxdepth 1 -type f \( -name '*.wic*' -o -name '*.manifest' \) -exec sha256sum '{}' \; > "$RUNNER_TEMP/aion-image-sha256.txt" 2>/dev/null || true
      - name: Upload bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-edge-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aion-evidence.txt
            ${{ runner.temp }}/aion-image-sha256.txt
            ${{ runner.temp }}/aion-kas-expanded.json
          if-no-files-found: warn
          retention-days: 14
