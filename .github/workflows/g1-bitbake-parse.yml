name: G1 BitBake metadata parse (public standard runner)

on:
  pull_request:
    paths:
      - 'bsp/**'
      - 'meta-aion/**'
      - '.github/workflows/g1-bitbake-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-parse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Real BitBake recipe parse (no image build)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Check resource limits
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          free_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          mem_kib="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          test "$free_kib" -ge 8388608
          test "$mem_kib" -ge 4194304
          echo "git_sha=$(git rev-parse HEAD)"
          df -h "$GITHUB_WORKSPACE"
          free -h
      # Ubuntu 22.04 is supported by Yocto 6.0 and avoids the Ubuntu 24.04
      # AppArmor restriction on unprivileged user namespaces; do not disable
      # AppArmor globally or mutate host kernel security settings.
      - name: Install Yocto host dependencies (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential chrpath cpio debianutils diffstat file gawk git \
            iputils-ping libacl1 libcrypt-dev locales python3 python3-venv \
            python3-git python3-jinja2 python3-pexpect python3-pip \
            python3-subunit socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
      - name: Install pinned kas and validate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aion-kas"
          "$RUNNER_TEMP/aion-kas/bin/pip" install --disable-pip-version-check 'kas==5.5'
          export KAS_WORK_DIR="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/aion-kas/bin/kas" dump --format json bsp/raspberrypi4-64.yml > "$RUNNER_TEMP/aion-dump.json"
          python3 tests/validate_kas_dump.py "$RUNNER_TEMP/aion-dump.json"
      - name: Checkout pinned Yocto layers and parse actual BitBake metadata
        shell: bash
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          export KAS_WORK_DIR="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/aion-kas/bin/kas" shell bsp/raspberrypi4-64.yml \
            -c 'bitbake -p && bitbake -e aion-health > /dev/null && bitbake -e aion-edge-image > /tmp/aion-edge-image.env && grep -E "^IMAGE_INSTALL=.*aion-health" /tmp/aion-edge-image.env'
      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "machine=raspberrypi4-64"
            echo "scope=bitbake_metadata_only"
            echo "no_image_built=true"
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RUNNER_TEMP/aion-g1-parse-evidence.txt"
      - name: Upload small diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-g1-metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aion-g1-parse-evidence.txt
            ${{ runner.temp }}/aion-dump.json
          if-no-files-found: warn
          retention-days: 7
